name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "k8s/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION:            ${{ secrets.AWS_REGION }}
  ECR_REGISTRY:          ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER:           ${{ secrets.EKS_CLUSTER }}
  K8S_NAMESPACE:         ${{ secrets.K8S_NAMESPACE || 'library' }}
  SNS_TOPIC_ARN:         ${{ secrets.SNS_TOPIC_ARN }}
  # ALB SG ID is account-specific — get from: terraform output alb_security_group_id
  # Store in GitHub secret ALB_SECURITY_GROUP_ID after terraform apply
  ALB_SECURITY_GROUP_ID: ${{ secrets.ALB_SECURITY_GROUP_ID }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # required for SonarQube git blame & Gitleaks full history scan

      # ── Secret Scanning — Gitleaks ────────────────────────────────────────
      # Scans the full git history for accidentally committed secrets
      # (API keys, passwords, tokens). Runs before everything else so
      # secrets are caught before any code is built or pushed.
      # exit-code 1 = secrets found → job fails, pipeline stops.
      - name: Gitleaks — secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm install --prefix app/frontend

      - name: Build frontend
        run: npm run build --prefix app/frontend

      - name: Install Python dependencies
        run: |
          pip install -r app/auth/requirements.txt
          pip install -r app/book/requirements.txt
          pip install -r app/borrow/requirements.txt
          pip install -r app/worker/requirements.txt

      # ── SCA — pip-audit (Python dependency vulnerability scan) ────────────
      # Scans requirements.txt files directly against the OSV vulnerability
      # database. This is different from Trivy which scans the built Docker
      # image — pip-audit catches vulnerable packages before the image is
      # even built, giving earlier feedback.
      # --fix is NOT used — we report only, don't auto-modify requirements.
      # continue-on-error: true keeps the pipeline running so you can see
      # all issues at once; remove this to make it blocking.
      - name: pip-audit — Python SCA
        run: |
          pip install pip-audit
          echo "=== auth/requirements.txt ==="
          pip-audit -r app/auth/requirements.txt    --desc --format columns || true
          echo "=== book/requirements.txt ==="
          pip-audit -r app/book/requirements.txt    --desc --format columns || true
          echo "=== borrow/requirements.txt ==="
          pip-audit -r app/borrow/requirements.txt  --desc --format columns || true
          echo "=== worker/requirements.txt ==="
          pip-audit -r app/worker/requirements.txt  --desc --format columns || true
        continue-on-error: true

      # Runs after deps are installed so the scanner has full context for
      # React JSX imports and Python module resolution.
      - name: SonarQube scan
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dproject.settings=sonar-project.properties

      # Polls SonarQube for the quality gate result using report-task.txt
      # written by the scan step above. Fails the job if gate is not passed,
      # which prevents build-push and deploy from running.
      - name: SonarQube quality gate check
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Validate Python syntax
        run: python -m compileall app/auth app/book app/borrow app/worker

      - name: Run tests
        run: echo "Add pytest commands here when tests exist"

  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:   auth
            context:   ./app/auth
            image:     digital-library-auth
            container: auth-service
          - service:   book
            context:   ./app/book
            image:     digital-library-book
            container: book-service
          - service:   borrow
            context:   ./app/borrow
            image:     digital-library-borrow
            container: borrow-service
          - service:   frontend
            context:   ./app/frontend
            image:     digital-library-frontend
            container: frontend
          - service:   worker
            context:   ./app/worker
            image:     digital-library-worker
            container: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ matrix.image }}:latest
            ${{ secrets.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.ECR_REGISTRY }}/${{ matrix.image }}:cache
          cache-to:   type=registry,ref=${{ secrets.ECR_REGISTRY }}/${{ matrix.image }}:cache,mode=max

      - name: Trivy vulnerability scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      ${{ secrets.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          format:         table
          exit-code:      "0"
          ignore-unfixed: true
          severity:       CRITICAL,HIGH

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER }}

      - name: Pre-flight cluster validation
        run: |
          echo "Checking EKS API access..."
          kubectl cluster-info
          echo "Checking auth permissions..."
          kubectl auth can-i '*' '*' --all-namespaces
          echo "Checking namespace target..."
          kubectl get namespace ${{ env.K8S_NAMESPACE }} || kubectl create namespace ${{ env.K8S_NAMESPACE }}

      - name: Render manifests with runtime values
        run: |
          mkdir -p /tmp/rendered-k8s
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path('k8s')
          out_dir = Path('/tmp/rendered-k8s')
          out_dir.mkdir(exist_ok=True)

          aws_account_id = os.popen("aws sts get-caller-identity --query Account --output text").read().strip()
          namespace = os.environ.get('K8S_NAMESPACE', 'library')
          replacements = {
              "${APP_POD_ROLE_ARN}": f"arn:aws:iam::{aws_account_id}:role/digital-library-prod-app-pod-role",
              "${CLOUDWATCH_AGENT_ROLE_ARN}": f"arn:aws:iam::{aws_account_id}:role/digital-library-prod-cloudwatch-agent-role",
              "${ALB_SECURITY_GROUP_ID}": os.environ.get('ALB_SECURITY_GROUP_ID', ''),
              "${K8S_NAMESPACE}": namespace,
          }

          for rel_path in [
              "namespace.yaml",
              "serviceaccount.yaml",
              "configmap.yaml",
              "auth-deployment.yaml",
              "book-deployment.yaml",
              "borrow-deployment.yaml",
              "frontend-deployment.yaml",
              "worker-deployment.yaml",
              "ingress.yaml",
              "hpa.yaml",
              "cloudwatch-daemonset-observability.yaml",
          ]:
              source = root / rel_path
              target = out_dir / rel_path
              text = source.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = text.replace('namespace: library', f'namespace: {namespace}')
              text = text.replace('name: library', f'name: {namespace}')
              target.write_text(text, encoding='utf-8')
          PY

      - name: Apply base manifests
        run: |
          kubectl apply -f /tmp/rendered-k8s/namespace.yaml
          kubectl apply -f /tmp/rendered-k8s/serviceaccount.yaml
          kubectl apply -f /tmp/rendered-k8s/configmap.yaml
          kubectl apply -f /tmp/rendered-k8s/cloudwatch-daemonset-observability.yaml

      - name: Apply service manifests
        run: |
          kubectl apply -f /tmp/rendered-k8s/auth-deployment.yaml
          kubectl apply -f /tmp/rendered-k8s/book-deployment.yaml
          kubectl apply -f /tmp/rendered-k8s/borrow-deployment.yaml
          kubectl apply -f /tmp/rendered-k8s/frontend-deployment.yaml
          kubectl apply -f /tmp/rendered-k8s/worker-deployment.yaml
          kubectl apply -f /tmp/rendered-k8s/ingress.yaml
          kubectl apply -f /tmp/rendered-k8s/hpa.yaml

      - name: Pin image tags to git SHA
        run: |
          kubectl set image deployment/auth-deployment \
            auth-service=${{ secrets.ECR_REGISTRY }}/digital-library-auth:${{ github.sha }} \
            -n ${{ secrets.K8S_NAMESPACE }}
          kubectl set image deployment/book-deployment \
            book-service=${{ secrets.ECR_REGISTRY }}/digital-library-book:${{ github.sha }} \
            -n ${{ secrets.K8S_NAMESPACE }}
          kubectl set image deployment/borrow-deployment \
            borrow-service=${{ secrets.ECR_REGISTRY }}/digital-library-borrow:${{ github.sha }} \
            -n ${{ secrets.K8S_NAMESPACE }}
          kubectl set image deployment/frontend-deployment \
            frontend=${{ secrets.ECR_REGISTRY }}/digital-library-frontend:${{ github.sha }} \
            -n ${{ secrets.K8S_NAMESPACE }}
          kubectl set image deployment/worker-deployment \
            worker=${{ secrets.ECR_REGISTRY }}/digital-library-worker:${{ github.sha }} \
            -n ${{ secrets.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          for dep in auth-deployment book-deployment borrow-deployment frontend-deployment worker-deployment; do
            echo "Waiting for $dep..."
            kubectl rollout status deployment/$dep \
              -n ${{ secrets.K8S_NAMESPACE }} --timeout=180s
          done

      - name: Smoke test and capture ALB DNS
        id: smoke
        run: |
          ALB_DNS=$(kubectl get ingress library-ingress \
            -n ${{ secrets.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ALB DNS: $ALB_DNS"
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          for i in 1 2 3 4 5; do
            curl -sf http://$ALB_DNS/auth/health   && \
            curl -sf http://$ALB_DNS/books/health  && \
            curl -sf http://$ALB_DNS/borrow/health && \
            echo "All health checks passed" && break
            echo "Not ready yet, waiting 15s..."
            sleep 15
          done

      # ── DAST — OWASP ZAP Baseline Scan ───────────────────────────────────
      # Passive scan only — crawls the app and checks for missing security
      # headers, information leaks, and common misconfigurations.
      # Does NOT send attack payloads — safe against a live environment.
      # continue-on-error: true so findings are visible in the job summary
      # without blocking the deployment that already succeeded above.
      - name: OWASP ZAP — DAST baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          target: "http://${{ steps.smoke.outputs.alb_dns }}"
          cmd_options: "-I"

      - name: Notify SNS — success
        if: success()
        continue-on-error: true
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "✅ Deployment Successful — Digital Library" \
            --message "Commit: ${{ github.sha }} by ${{ github.actor }}" \
            --region ${{ secrets.AWS_REGION }}

      - name: Notify SNS — failed
        if: failure()
        continue-on-error: true
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "❌ Deployment FAILED — Digital Library" \
            --message "Commit: ${{ github.sha }} — Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --region ${{ secrets.AWS_REGION }}
