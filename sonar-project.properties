# sonar-project.properties
# sonar.host.url and sonar.token are injected via GitHub secrets — not hardcoded here.

# ── Project identity ──────────────────────────────────────────────────────────
# projectKey must match exactly what you created in the SonarQube UI.
# Aligned with terraform project_name = "digital-library"
sonar.projectKey=digital-library
sonar.projectName=3-Tier Digital Library Application
sonar.projectVersion=1.0

# ── Source paths ──────────────────────────────────────────────────────────────
# All application code lives under app/
sonar.sources=app

# Exclude compiled output, dependencies, and non-source files
sonar.exclusions=\
  **/node_modules/**,\
  app/frontend/dist/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/requirements.txt,\
  **/Dockerfile,\
  **/.dockerignore,\
  app/database/**

# ── Python (FastAPI services: auth, book, borrow, worker) ────────────────────
sonar.python.version=3.11

# ── JavaScript / React (Vite + React 18 frontend) ────────────────────────────
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# ── Quality Gate ──────────────────────────────────────────────────────────────
# Quality gate is checked by sonarqube-quality-gate-action in ci-cd.yml.
# Setting wait=true here causes the scanner to poll directly which can
# timeout on slower connections. The separate action is more resilient.
sonar.qualitygate.wait=false
sonar.qualitygate.timeout=300

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
